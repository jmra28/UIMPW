<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navbar + Logo Fijo con Movimiento</title>
<style>
    /* --- RESET SIMPLE --- */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    /* --- NAVBAR --- */
    .navbar {
        background-color: #333;
        color: white;
        padding: 15px 20px;
        font-size: 18px;
        z-index: 1000;
        position: relative;
    }

    /* --- SLIDER --- */
    .slider {
        width: 100%;
        height: 350px;
        overflow: hidden;
    }
    .slider img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    /* --- LOGO FIJO --- */
    .logo-overlay {
        position: fixed;
        top: 50px;  /* posición inicial debajo del navbar */
        right: 20px;
        z-index: 2000;
        width: 120px;
        background: white;
        padding: 5px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        transition: top 0.3s ease; /* animación suave */
    }

    /* --- Cuando el logo debe pegarse arriba --- */
    .logo-fixed {
        top: 0px; /* pegado al borde superior */
    }

    /* --- CONTENIDO DE PRUEBA --- */
    .contenido {
        padding: 20px;
        line-height: 1.6;
        height: 1500px; /* para probar el scroll */
    }
</style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar">
        Menú de Navegación
    </div>

    <!-- LOGO FIJO -->
    <img src="https://via.placeholder.com/120x60?text=LOGO" alt="Logo Empresa" class="logo-overlay" id="logo">

    <!-- SLIDER -->
    <div class="slider">
        <img src="https://picsum.photos/id/1018/1000/350" alt="Imagen Slider 1">
    </div>

    <!-- CONTENIDO DE PRUEBA -->
    <div class="contenido">
        <p>Haz scroll para ver cómo el logo sube hasta el borde superior cuando el navbar desaparece.</p>
    </div>

    
<br><br><br><br><br><br><br><br><br><br><br>
<br><br><br><br><br><br><br><br><br><br><br>
<br><br><br><br><br><br><br><br><br><br><br>
<br><br><br><br><br><br><br><br><br><br><br>
<br><br><br><br><br><br><br><br><br><br><br>
<br><br><br><br><br><br><br><br><br><br><br>
<br><br><br><br><br><br><br><br><br><br><br>
<br><br><br><br><br><br><br><br><br><br><br>
<br><br><br><br><br><br><br><br><br><br><br>
<br><br><br><br><br><br><br><br><br><br><br>

    <!-- SCRIPT PARA DETECTAR SCROLL -->
    <script>
        const logo = document.getElementById('logo');
        const triggerHeight = 50; // altura de scroll para que el logo suba

        window.addEventListener('scroll', () => {
            if (window.scrollY > triggerHeight) {
                logo.classList.add('logo-fixed');
            } else {
                logo.classList.remove('logo-fixed');
            }
        });
    </script>

</body>
</html>
